<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>San Diego : In Play — A Pickleball Court Atlas</title>
  <meta name="description" content="Open play times, public and private courts, and official schedules for pickleball, tennis, padel, racquetball, squash and ping pong in San Diego." />
  <link rel="icon" type="image/svg+xml" href="images/logo.svg" />
  <meta name="theme-color" content="#102F46" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="San Diego : In Play — Kinetic Court SD" />
  <meta property="og:description" content="Find pickleball open play today. Public and private courts, schedules and a court map for San Diego County." />
  <meta property="og:image" content="https://kenetic-court-sd.github.io/images/hero.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    const c = (v) => `hsl(var(--${v}) / <alpha-value>)`;
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: c("background"),
            foreground: c("foreground"),
            primary: { DEFAULT: c("primary"), foreground: c("primary-foreground") },
            secondary: { DEFAULT: c("secondary"), foreground: c("secondary-foreground") },
            muted: { DEFAULT: c("muted"), foreground: c("muted-foreground") },
            ocean: c("ocean"),
            coral: c("coral"),
            sand: c("sand"),
            pop: c("pop"),
            destructive: c("destructive"),
            border: c("border"),
            input: c("input"),
            ring: c("ring"),
          },
          fontFamily: {
            display: ["Fredoka", "ui-rounded", "system-ui", "sans-serif"],
            body: ['"DM Sans"', "ui-sans-serif", "system-ui", "sans-serif"],
            // Small labels and times. Kept under the name "mono" from the earlier design.
            mono: ['"DM Sans"', "ui-sans-serif", "system-ui", "sans-serif"],
          },
        },
      },
    };
  </script>

  <style>
    /* ---- Sunny SoCal palette ---- */
    :root {
      --background: 42 100% 97%;          /* warm cream */
      --foreground: 207 62% 17%;          /* deep ocean navy */
      --primary: 45 93% 58%;              /* pickleball yellow */
      --primary-foreground: 207 62% 17%;
      --secondary: 192 55% 92%;           /* pale aqua */
      --secondary-foreground: 207 62% 17%;
      --muted: 192 55% 92%;
      --muted-foreground: 207 24% 36%;
      --ocean: 197 80% 33%;               /* ocean blue */
      --coral: 12 82% 62%;                /* sunset coral */
      --sand: 40 62% 85%;                 /* beach sand */
      --destructive: 4 75% 46%;
      --border: 40 48% 84%;
      --input: 40 40% 78%;
      --ring: 197 80% 33%;
      --pop: var(--ocean);                /* highlight text: blue on light, yellow on dark */
    }
    .on-dark { --pop: var(--primary); }

    * { border-color: hsl(var(--border)); }
    body {
      margin: 0;
      background: hsl(var(--background));
      color: hsl(var(--foreground));
      font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .font-display { font-family: "Fredoka", ui-rounded, system-ui, sans-serif; font-weight: 600; letter-spacing: -0.015em; }
    .font-mono { font-weight: 600; font-variant-numeric: tabular-nums; }

    /* Pickleball-hole dots */
    .mesh-overlay {
      background-image: radial-gradient(circle, currentColor 2.6px, transparent 3px), radial-gradient(circle, currentColor 2.6px, transparent 3px);
      background-size: 34px 34px;
      background-position: 0 0, 17px 17px;
      color: hsl(var(--foreground) / 0.09);
    }
    /* Net texture */
    .netline {
      background-image:
        repeating-linear-gradient(to right, currentColor 0, currentColor 1px, transparent 1px, transparent 16px),
        repeating-linear-gradient(to bottom, currentColor 0, currentColor 1px, transparent 1px, transparent 16px);
    }
    .hard-shadow { box-shadow: 8px 8px 0 hsl(var(--foreground) / 0.13); }
    .hard-shadow-clay { box-shadow: 8px 8px 0 hsl(var(--primary)); }

    /* Entrance animations */
    .fade-up { opacity: 0; transform: translateY(var(--fy, 10px)); animation: fadeUp .8s ease-out forwards; animation-delay: var(--d, 0s); }
    .fade-in { opacity: 0; animation: fadeIn 1s ease-out forwards; animation-delay: var(--d, 0s); }
    @keyframes fadeUp { to { opacity: 1; transform: none; } }
    @keyframes fadeIn { to { opacity: 1; } }
    .bob { animation: bob 1.8s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(8px); } }
    /* A pickleball that bounces once when it appears */
    .ball-bounce { display: inline-block; animation: ballBounce 1.1s cubic-bezier(.3,.6,.4,1) .9s both; }
    @keyframes ballBounce { 0% { transform: translateY(-1.6em); opacity: 0; } 45% { transform: translateY(0); opacity: 1; } 65% { transform: translateY(-.45em); } 82% { transform: translateY(0); } 91% { transform: translateY(-.12em); } 100% { transform: translateY(0); } }

    .reveal { opacity: 0; transform: translateY(var(--ry, 40px)); transition: opacity .6s ease-out, transform .6s ease-out; transition-delay: var(--d, 0s); }
    .reveal.in { opacity: 1; transform: none; }

    .faq-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .2s ease-out; }
    .faq-item.open .faq-body { grid-template-rows: 1fr; }
    .faq-item.open .faq-chevron { transform: rotate(180deg); }

    /* Rows of buttons that scroll sideways on small screens */
    .overflow-x-auto { scrollbar-width: none; -ms-overflow-style: none; }
    .overflow-x-auto::-webkit-scrollbar { display: none; }
    @media (max-width: 1023px) {
      .scroll-hint { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 36px), transparent); padding-right: 28px; }
    }

    /* Keyboard focus ring */
    :focus-visible { outline: 3px solid hsl(var(--ocean)); outline-offset: 2px; }
    .on-dark :focus-visible { outline-color: hsl(var(--primary)); }

    /* Map */
    .map-box { height: 16rem; }
    .map-box-lg { height: 420px; }
    @media (min-width: 640px) { .map-box-lg { height: 560px; } }
    .court-pin { background: none; border: 0; filter: drop-shadow(0 3px 3px hsl(var(--foreground) / .35)); }
    .leaflet-container { font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif; }
    .leaflet-popup-content-wrapper { border-radius: 20px; box-shadow: 0 10px 30px hsl(var(--foreground) / .25); }
    .leaflet-popup-content { margin: 14px 18px; }
    .map-pop p { margin: 0; }
    .map-pop-area { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: hsl(var(--ocean)); }
    .map-pop-name { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 19px; line-height: 1.15; color: hsl(var(--foreground)); margin-top: 4px !important; }
    .map-pop-line { font-size: 13px; color: hsl(var(--muted-foreground)); margin-top: 4px !important; }
    .map-pop-link { display: inline-block; margin-top: 10px; padding: 7px 14px; border-radius: 999px; background: hsl(var(--primary)); color: hsl(var(--primary-foreground)) !important; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; text-decoration: none; }

    @media (prefers-reduced-motion: reduce) {
      .fade-up, .fade-in, .reveal { opacity: 1; transform: none; animation: none; transition: none; }
      .bob, .ball-bounce { animation: none; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Change the number after ?v= whenever data.js or app.js changes, so browsers load the new files right away. -->
  <script src="data.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
